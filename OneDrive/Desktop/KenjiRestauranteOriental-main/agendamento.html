<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenji Restaurante Oriental | Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
      <link rel="icon" type="image/png" href="./img/favicon.png" />
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="agendamento.css"/>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-kenji fixed-top" id="mainNav">
      <div class="container">
        <a class="navbar-brand navbar-brand-kenji" href="index.html">
          <span>賢治</span> Kenji Restaurante
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navMenu">
          <ul class="navbar-nav align-items-lg-center gap-lg-1 me-lg-3">
            <li class="nav-item"><a class="nav-link nav-link-kenji" href="sobre.html">Sobre o Restaurante</a></li>
            <li class="nav-item"><a class="nav-link nav-link-kenji" href="index.html#cardapio">Cardápio</a></li>
            <li class="nav-item"><a class="nav-link nav-link-kenji" href="index.html#galeria">Mais Pedidos</a></li>
            <li class="nav-item"><a class="nav-link nav-link-kenji" href="index.html#delivery">Delivery</a></li>
            <li class="nav-item"><a class="nav-link nav-link-kenji" href="index.html#contato">Contato</a></li>
            <li class="nav-item"><a class="nav-link nav-link-kenji active" href="agendamento.html">Agendamento</a></li>
          </ul>
          <a href="https://www.instagram.com/kenji_restaurante_oriental/" target="_blank" class="btn btn-reserva">
            <i class="bi bi-instagram me-1"></i> Siga-nos
          </a>
        </div>
      </div>
    </nav>

    <main class="container py-5" style="margin-top: 80px;">
        <h2 class="text-white text-center mb-5">Formulário de Agendamento</h2>
        
        <div class="row justify-content-center g-4">
            <div class="col-lg-7">
                <div class="card p-4 shadow-sm bg-dark text-white border-secondary">
                    <form id="formReserva" novalidate>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">NOME COMPLETO *</label>
                                <input type="text" class="form-control" id="nome" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">TELEFONE *</label>
                                <input type="tel" class="form-control" id="telefone" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">E-MAIL *</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">QUANTIDADE DE PESSOAS *</label>
                                <div class="input-group">
                                    <button class="btn btn-outline-secondary" type="button" id="btnDec">-</button>
                                    <input type="number" class="form-control text-center" id="pessoas" value="1" readonly>
                                    <button class="btn btn-outline-secondary" type="button" id="btnInc">+</button>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">DATA *</label>
                                <input type="date" class="form-control" id="data" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">HORÁRIO *</label>
                                <input type="text" class="form-control" id="horarioSelecionado" placeholder="Selecione na lista" readonly>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 mt-3">ENVIAR AGENDAMENTO</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-3">
                <div class="card p-4 bg-dark text-white border-secondary h-100">
                    <h5>Horários Disponíveis</h5>
                    <p class="text-muted small">Domingo a Sexta</p>
                    <div class="d-grid gap-2" id="listaHorarios">
                        <button type="button" class="btn btn-time" data-time="11:00">11:00</button>
                        <button type="button" class="btn btn-time" data-time="11:30">11:30</button>
                        <button type="button" class="btn btn-time" data-time="12:00">12:00</button>
                        <button type="button" class="btn btn-time" data-time="12:30">12:30</button>
                        <button type="button" class="btn btn-time" data-time="13:00">13:00</button>
                        <button type="button" class="btn btn-time" data-time="13:30">13:30</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #1e1e1e; border: 1px solid #333; color: white;">
                <div class="modal-body p-4 text-center">
                    <h5>Confirmação</h5>
                    <p id="mensagemConfirmacao" class="mt-3 text-start"></p>
                    <a href="index.html" class="btn btn-danger w-100 mt-3">HOME</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="agendamento.js"></script>
</body>
</html>
